<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My Personal Website</title>
    <link rel="stylesheet" href="style.css">
    <script src="layout.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div data-site-header></div>

    <main>
        <section id="contact">
            <div class="contact-layout">
                <div class="contact-intro">
                    <p class="contact-eyebrow">GET IN TOUCH</p>
                    <h2>Let's start a conversation</h2>
                    <p class="contact-copy">Have a question or opportunity in mind? Send a message and I'll be glad to hear from you.</p>
                    <a class="call-button" href="tel:+919860994988">Call me: +91 98609 94988</a>
                </div>
                <form id="contactForm" class="contact-form">
                    <div class="contact-field">
                        <label for="visitorName">Your name</label>
                        <input type="text" id="visitorName" name="name" autocomplete="name" placeholder="Enter your name" required>
                    </div>
                    <div class="contact-field">
                        <label for="visitorEmail">Email address</label>
                        <input type="email" id="visitorEmail" name="email" autocomplete="email" placeholder="you@example.com" required>
                    </div>
                    <div class="contact-field">
                        <label for="visitorMessage">Your message</label>
                        <textarea id="visitorMessage" name="message" rows="5" placeholder="How can I help?" required></textarea>
                    </div>
                    <button class="contact-submit" type="submit">Send message</button>
                    <p id="result" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>

    <div data-site-footer></div>
</body>
</html>
