<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Slideshow | My Personal Website</title>
    <link rel="stylesheet" href="style.css">
    <script src="layout.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div data-site-header></div>

    <main>
        <section id="slider-section">
            <h2>My Photo Slideshow</h2>
            <div class="slider">
                <img id="slideImage" src="images/photo1.jpg" alt="My photograph">
                <div class="slider-buttons">
                    <button type="button" onclick="previousSlide()">Previous</button>
                    <button type="button" onclick="nextSlide()">Next</button>
                </div>
            </div>
            <div class="slide-sources" hidden>
                <img src="images/photo1.jpg" alt="">
                <img src="images/photo2.jpg" alt="">
                <img src="images/photo3.jpg" alt="">
            </div>
        </section>
    </main>

    <div data-site-footer></div>
</body>
</html>
